{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
        <div class="register">
            <input autocomplete="off" autofocus name="username" value="{{ username }}" placeholder="Username" type="text">
        </div>
        <div class="register">
            <input name="password" placeholder="Password" type="password">
        </div>
        <div class="register">
            <input name="confirmation" placeholder="Confirm Password" type="password">
        </div>
        <button class="register-btn" type="submit">Register</button>
    </form>
{% endblock %}

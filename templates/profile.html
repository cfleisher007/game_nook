{% extends "layout.html" %}

{% block title %}
    Profile
{% endblock %}

{% block main %}
    <div class="btn edit-profile">
        <form action="/profile" method="post">
            <input autocomplete="off" autofocus class="form-control" name="nickname" value="{{ nickname }}" placeholder="Edit nickname" type="text">
            <button class="btn btn-primary" type="submit">Confirm</button>
        </form>
        
    </div>
    <div class="account">
        <a class="btn" href="/change-password">Change password</a>
        <a class="btn" href="/logout">Log out</a>
        <a class="btn" href="/delete-account">Delete account</a> 
    </div>
{% endblock %}

{% extends "layout.html" %}

{% block title %}
    2048 Game
{% endblock %}

{% block main %}

    <div class="heading">
        <div class="game-name">2048</div>

        <div id="score">
            <span class="score-label">Score</span>
            <span class="score-value"></span>
        </div>

        <div id="high-score">
            <span class="score-label">High score</span>
            <span class="score-value">{{ high_score }}</span>
        </div>

        <div id="new-game">
            <button id="new-game-btn">New Game</button>
        </div>
    </div>

    <div class="game-board-2048">
        {% for cell in range(16) %}
            <div class="board-cell-2048"></div>
        {% endfor %}
    </div>

    <script>
        const savedGameData = JSON.parse('{{ data | tojson }}');
    </script>

    <script src="/static/js/2048.js"></script>

{% endblock %}

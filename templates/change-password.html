{% extends "layout.html" %}

{% block title %}
    Change-Password
{% endblock %}

{% block main %}
    <form action="/change-password" method="post">
        <div class="change-password">
            <input autocomplete="off" autofocus name="old-password" placeholder="Old Password" type="password">
        </div>
        <div class="change-password">
            <input autocomplete="off" name="new-password" placeholder="New Password" type="password">
        </div>
        <div class="change-password">
            <input autocomplete="off" name="confirm-new-password" placeholder="Confirm New Password" type="password">
        </div>
        <button class="change-password-btn" type="submit">Confirm</button>
    </form>
{% endblock %}
